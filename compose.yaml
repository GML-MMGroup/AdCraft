name: adcraft

services:
  cpa:
    build:
      context: ./cpa
      dockerfile: Dockerfile
      args:
        CLI_PROXY_IMAGE: ${CLI_PROXY_IMAGE:-eceasy/cli-proxy-api:latest}
    image: adcraft-cpa:local
    environment:
      DEPLOY: ${DEPLOY:-}
    ports:
      - "${CLI_PROXY_HOST:-127.0.0.1}:${CLI_PROXY_PORT:-8317}:8317"
    volumes:
      - ${CLI_PROXY_CONFIG_PATH:-./cpa/config.yaml}:/CLIProxyAPI/config.yaml:ro
      - ${CLI_PROXY_AUTH_PATH:-./cpa/auths}:/root/.cli-proxy-api
      - ${CLI_PROXY_LOG_PATH:-./cpa/logs}:/CLIProxyAPI/logs
    healthcheck:
      test: ["CMD-SHELL", "code=$$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8317/v1/models || true); case \"$$code\" in 200|401|404) exit 0;; *) exit 1;; esac"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks:
      - adcraft-internal

  agent:
    build:
      context: ./apps/api
      dockerfile: agent/Dockerfile
    environment:
      AGENT_RUNTIME_HOST: 0.0.0.0
      AGENT_RUNTIME_PORT: 8765
      AGENT_RUNTIME_PYTHON_BASE_URL: http://api:8000
      AGENT_RUNTIME_INTERNAL_TOKEN: ${ADCRAFT_AGENT_RUNTIME_TOKEN:?Run the deployment launcher to create the internal Agent token.}
    init: true
    expose:
      - "8765"
    healthcheck:
      test:
        - CMD-SHELL
        - "node -e \"fetch('http://127.0.0.1:8765/internal/v1/health',{headers:{authorization:'Bearer '+process.env.AGENT_RUNTIME_INTERNAL_TOKEN}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks:
      - adcraft-internal

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    env_file:
      - ./apps/api/.env
    environment:
      HOME: /tmp
      MEDIA_DATA_DIR: /app/data
      LLM_BASE_URL: ${ADCRAFT_LLM_BASE_URL:-http://cpa:8317/v1}
      LLM_API_KEY: ${ADCRAFT_LLM_API_KEY:-}
      LOCAL_SETTINGS_ALLOWED_ORIGINS: "http://127.0.0.1:${ADCRAFT_PORT},http://localhost:${ADCRAFT_PORT}"
      AGENT_RUNTIME_BASE_URL: http://agent:8765
      AGENT_RUNTIME_INTERNAL_TOKEN: ${ADCRAFT_AGENT_RUNTIME_TOKEN:?Run the deployment launcher to create the internal Agent token.}
    user: "${ADCRAFT_UID:-1000}:${ADCRAFT_GID:-1000}"
    init: true
    expose:
      - "8000"
    volumes:
      - ./apps/api:/app
      - ./runtime-data/api:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    depends_on:
      cpa:
        condition: service_healthy
      agent:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - adcraft-internal

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ADCRAFT_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - adcraft-internal

networks:
  adcraft-internal:
    name: adcraft-internal
